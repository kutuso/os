# kutu OS systemd optimizations
# /etc/systemd/system.conf.d/00-kutu-optimizations.conf

[Manager]
# Limit journal size
SystemMaxUse=500M
RuntimeMaxUse=100M

# CPU affinity (leave core 0 for system, rest for inference)
CPUAffinity=0

# Default limits for services
DefaultLimitNOFILE=1048576
DefaultLimitNPROC=512000

# Faster shutdown
DefaultTimeoutStopSec=10s
DefaultTimeoutStartSec=30s

# Watchdog
RuntimeWatchdogSec=0
ShutdownWatchdogSec=10min
