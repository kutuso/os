# kutu OS sysctl optimizations for ML inference
# /etc/sysctl.d/99-kutu-performance.conf

### CPU ###
# Scheduler tuning for sustained compute
kernel.sched_latency_ns = 60000000
kernel.sched_min_granularity_ns = 10000000
kernel.sched_wakeup_granularity_ns = 15000000
kernel.sched_migration_cost_ns = 5000000

### Memory Management ###
# Reduce swappiness (prefer RAM)
vm.swappiness = 10

# Allow more dirty memory before writing (better for burst writes)
vm.dirty_ratio = 20
vm.dirty_background_ratio = 10

# Increase writeback time for better I/O batching
vm.dirty_expire_centisecs = 3000
vm.dirty_writeback_centisecs = 1500

# Huge pages for large model memory allocation
vm.nr_hugepages = 1024
vm.hugetlb_shm_group = 1000

# OOM killer tuning
vm.oom_kill_allocating_task = 1
vm.overcommit_memory = 1
vm.overcommit_ratio = 100

# VFS cache pressure (prefer keeping inodes/dentries)
vm.vfs_cache_pressure = 50

### Network ###
# TCP optimizations for local network
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.core.optmem_max = 65536
net.core.netdev_max_backlog = 5000

net.ipv4.tcp_rmem = 4096 1048576 33554432
net.ipv4.tcp_wmem = 4096 1048576 33554432
net.ipv4.tcp_mem = 786432 1048576 26777216

# TCP tuning
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 10

# Increase connection backlog
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 8192

### File System ###
# Increase file handles
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 512

### Kernel ###
# Increase PID limit
kernel.pid_max = 4194304

# Core dumps (disable for production)
kernel.core_pattern = |/bin/false

# Reduce kernel log verbosity
kernel.printk = 3 3 3 3

# Watchdog disabled
kernel.nmi_watchdog = 0

### Performance ###
# CPU frequency governor (set to performance)
# Handled by cpupower service

### Security vs Performance Trade-offs ###
# Disable ASLR for slight performance gain (security impact)
# kernel.randomize_va_space = 0

# Disable kernel address exposure
kernel.kptr_restrict = 1
