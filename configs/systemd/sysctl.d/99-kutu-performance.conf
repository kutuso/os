# kutu OS sysctl optimizations for distributed AI inference
# /etc/sysctl.d/99-kutu-performance.conf
# Kernel 6.12+ required
# Documentation: docs/KERNEL.md

###############################################################################
# CPU Scheduler - Tuned for Sustained Compute Workloads
###############################################################################

# Scheduler latency target (60ms - good for throughput)
kernel.sched_latency_ns = 60000000

# Minimum task runtime before preemption (10ms)
kernel.sched_min_granularity_ns = 10000000

# Wake-up granularity (15ms - balance between latency and throughput)
kernel.sched_wakeup_granularity_ns = 15000000

# Migration cost (5ms - prevent excessive task migration)
kernel.sched_migration_cost_ns = 5000000

# Number of scheduler domains to scan when idle
kernel.sched_domain.cpu0.domain0.busy_factor = 32
kernel.sched_domain.cpu0.domain0.imbalance_pct = 125

# Autogroup aggressive scheduling disabled for consistent performance
kernel.sched_autogroup_enabled = 0

###############################################################################
# Memory Management - Critical for Multi-Model AI Workloads
###############################################################################

# Swappiness - Strongly prefer keeping memory resident (1-10 for AI workloads)
# 10 = aggressive preference for RAM, 1 = nearly disable swap
vm.swappiness = 10

# Memory overcommit - Heuristic mode (0 = heuristic, 1 = always, 2 = never)
vm.overcommit_memory = 0
vm.overcommit_ratio = 50

# Dirty memory writeback - Optimized for NVMe
# Allows 15% of RAM dirty before forced writeback
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5

# Writeback timing (faster for NVMe, reduces latency spikes)
vm.dirty_expire_centisecs = 1500
vm.dirty_writeback_centisecs = 500

# Minimum free memory (1-2% of total RAM)
# For 96GB system: ~1GB free minimum
# For 128GB system: ~1.3GB free minimum
# Adjust based on your RAM size
vm.min_free_kbytes = 1048576

# Huge Pages - Allocated dynamically via THP, not static allocation
# Static huge pages reserved at boot via kernel cmdline
# This is for runtime allocation tracking
vm.nr_hugepages = 0
vm.hugetlb_shm_group = 1000

# VFS cache pressure (50 = balanced, higher = prefer freeing cache)
vm.vfs_cache_pressure = 50

# OOM killer tuning
vm.oom_kill_allocating_task = 0
vm.panic_on_oom = 0

# Zone reclaim mode (0 = prefer remote memory over reclaim on NUMA)
vm.zone_reclaim_mode = 0

# Compaction proactiveness (0-100, higher = more aggressive)
# Keep low to prevent compaction latency spikes during inference
vm.compaction_proactiveness = 10

# Page lock unfairness
vm.page_lock_unfairness = 5

###############################################################################
# Network Stack - Optimized for P2P Distributed Workloads
###############################################################################

# Socket buffer sizes (16MB max for high-bandwidth P2P)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.core.optmem_max = 65536

# Network device backlog (handle bursts)
net.core.netdev_max_backlog = 16384

# Low-latency busy polling (microseconds)
# Enable for <10μs receive latency (burns CPU cycles)
net.core.busy_poll = 50
net.core.busy_read = 50

# TCP memory (min, default, max in pages)
net.ipv4.tcp_mem = 786432 1048576 26777216

# TCP socket buffers (min, default, max in bytes)
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# TCP congestion control - BBR for high throughput and low latency
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq

# TCP fast open (3 = enable client and server)
net.ipv4.tcp_fastopen = 3

# TCP tuning for sustained connections
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 10
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 60
net.ipv4.tcp_keepalive_probes = 5

# Connection tracking
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_max_tw_buckets = 2000000

# TCP window scaling
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_sack = 1

# IP forwarding (enable if routing between nodes)
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# MTU probing (helps find optimal packet size)
net.ipv4.tcp_mtu_probing = 1

###############################################################################
# File System Limits
###############################################################################

# Maximum number of file handles
fs.file-max = 4194304

# Inotify limits (for file monitoring tools)
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 1024

# AIO limits
fs.aio-max-nr = 1048576

###############################################################################
# Kernel Tuning
###############################################################################

# PID limit (handled via kernel cmdline, but set runtime too)
kernel.pid_max = 4194304

# Core dumps - Disable for production (saves disk space and time)
kernel.core_pattern = |/bin/false
kernel.core_uses_pid = 0

# Kernel log level (3 = errors only)
kernel.printk = 3 3 3 3
kernel.printk_ratelimit = 5
kernel.printk_ratelimit_burst = 10

# Watchdog disabled (kernel cmdline also disables)
kernel.nmi_watchdog = 0
kernel.soft_watchdog = 0

# Panic behavior
kernel.panic = 10
kernel.panic_on_oops = 0

# Kernel message buffer size
kernel.msgmnb = 65536
kernel.msgmax = 65536

# Shared memory limits (for large models in shared memory)
kernel.shmmax = 68719476736
kernel.shmall = 4294967296

# Semaphore limits
kernel.sem = 250 32000 100 128

###############################################################################
# Security vs Performance Tradeoffs
###############################################################################

# Kernel pointer restriction (1 = hide from non-privileged)
kernel.kptr_restrict = 1

# Dmesg restriction (0 = allow all, 1 = restrict)
kernel.dmesg_restrict = 0

# Ptrace scope (1 = restricted)
kernel.yama.ptrace_scope = 1

# ASLR (2 = full randomization)
# Do NOT disable unless absolutely necessary for debugging
kernel.randomize_va_space = 2

# Virtual memory mmap limits
vm.mmap_min_addr = 65536

###############################################################################
# Real-Time and Latency
###############################################################################

# Kernel thread nice level (lower = higher priority)
kernel.sched_rt_runtime_us = 950000
kernel.sched_rt_period_us = 1000000

###############################################################################
# Hardware-Specific Optimizations
###############################################################################

# Transparent Huge Pages (managed via kernel cmdline)
# Runtime control via /sys/kernel/mm/transparent_hugepage/
# These settings persist across reboots

# NUMA balancing (enabled via kernel cmdline)
# Runtime scanning parameters
kernel.numa_balancing_scan_delay_ms = 1000
kernel.numa_balancing_scan_period_min_ms = 1000
kernel.numa_balancing_scan_period_max_ms = 60000
kernel.numa_balancing_scan_size_mb = 256

###############################################################################
# Performance Monitoring
###############################################################################

# Perf event limits
kernel.perf_event_paranoid = 2
kernel.perf_event_max_sample_rate = 100000
kernel.perf_cpu_time_max_percent = 25

###############################################################################
# Notes
###############################################################################
#
# Key Optimizations for AI Workloads:
# 1. Low swappiness (10) keeps models in RAM
# 2. Large socket buffers (16MB) for P2P communication
# 3. BBR congestion control for better throughput
# 4. Low compaction proactiveness prevents latency spikes
# 5. Busy polling for sub-10μs network latency
# 6. Huge pages via THP with madvise mode
# 7. NUMA balancing for cache locality
#
# Expected Results:
# - 10-15% lower inference latency vs default config
# - 10-20% higher throughput (tokens/second)
# - Consistent latency without spikes
# - Better sustained performance without thermal throttling
#
# Monitoring:
# - Use 'sysctl -a' to view all parameters
# - Use 'sysctl vm.swappiness' to check specific values
# - Use 'sysctl -p' to reload this file
#
###############################################################################
