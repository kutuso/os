# kutu OS Name Service Switch configuration
# /etc/nsswitch.conf
# mDNS enabled for .local domain resolution

passwd: files systemd
group: files systemd
shadow: files systemd
gshadow: files systemd

hosts: mymachines mdns_minimal [NOTFOUND=return] resolve [!UNAVAIL=return] files myhostname dns
networks: files

protocols: files
services: files
ethers: files
rpc: files

netgroup: files
