<?xml version="1.0" encoding="UTF-8"?>
<!-- kutu OS Wallpaper - Diagonal Pastel Stripes -->
<svg width="3840" height="2160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Pattern for diagonal stripes -->
    <pattern id="diagonal-stripes" x="0" y="0" width="700" height="700" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="100" height="700" fill="#FFB3BA"/>    <!-- Pastel Pink -->
      <rect x="100" y="0" width="100" height="700" fill="#FFDFBA"/>  <!-- Pastel Peach -->
      <rect x="200" y="0" width="100" height="700" fill="#FFFFBA"/>  <!-- Pastel Yellow -->
      <rect x="300" y="0" width="100" height="700" fill="#BAFFC9"/>  <!-- Pastel Green -->
      <rect x="400" y="0" width="100" height="700" fill="#BAE1FF"/>  <!-- Pastel Blue -->
      <rect x="500" y="0" width="100" height="700" fill="#D4BAFF"/>  <!-- Pastel Purple -->
      <rect x="600" y="0" width="100" height="700" fill="#FFB3E6"/>  <!-- Pastel Magenta -->
    </pattern>

    <!-- Vignette effect -->
    <radialGradient id="vignette">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0" />
      <stop offset="70%" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.3" />
    </radialGradient>
  </defs>

  <!-- Striped background -->
  <rect width="3840" height="2160" fill="url(#diagonal-stripes)"/>

  <!-- Vignette overlay -->
  <rect width="3840" height="2160" fill="url(#vignette)"/>

  <!-- Floating logo in corner -->
  <g transform="translate(3200, 1520)">
    <rect x="0" y="0" width="480" height="480" rx="80" ry="80"
          fill="white" opacity="0.9"
          style="filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3));"/>

    <rect x="20" y="20" width="440" height="440" rx="70" ry="70"
          fill="url(#diagonal-stripes)"/>

    <text x="240" y="320"
          font-family="Arial, sans-serif"
          font-size="260"
          font-weight="bold"
          fill="white"
          text-anchor="middle"
          style="text-shadow: 2px 2px 8px rgba(0,0,0,0.3);">K</text>
  </g>
</svg>
