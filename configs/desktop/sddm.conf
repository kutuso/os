# kutu OS SDDM Configuration
# /etc/sddm.conf.d/kutu.conf

[Theme]
Current=breeze
CursorTheme=breeze_cursors

[General]
# Display server
DisplayServer=wayland
# Fallback to X11 if Wayland fails
DisplayStopCommand=
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

# User and session defaults
DefaultSession=plasma.desktop
EnableHiDPI=true
Numlock=on

# Auto-login configuration (disabled by default, can be enabled post-install)
# User=kutu
# Session=plasma.desktop

[Wayland]
SessionDir=/usr/share/wayland-sessions
CompositorCommand=kwin_wayland --no-lockscreen --no-global-shortcuts --locale1

[X11]
SessionDir=/usr/share/xsessions
UserAuthFile=.Xauthority
DisplayCommand=/usr/share/sddm/scripts/Xsetup
DisplayStopCommand=/usr/share/sddm/scripts/Xstop

[Users]
MaximumUid=60000
MinimumUid=1000
HideUsers=
HideShells=/sbin/nologin,/bin/false
RememberLastUser=true
RememberLastSession=true
