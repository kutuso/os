# kutu OS SYSLINUX Configuration
# Optimized for AI/ML inference workloads

DEFAULT kutu
TIMEOUT 50
PROMPT 1

MENU TITLE kutu OS Boot Menu
MENU BACKGROUND splash.png

LABEL kutu
    MENU LABEL kutu OS
    LINUX /arch/boot/x86_64/vmlinuz-linux
    INITRD /arch/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=kutu archisolabel=KUTU_OS quiet splash loglevel=3 mitigations=off transparent_hugepage=madvise nvme_core.default_ps_max_latency_us=0 nowatchdog nmi_watchdog=0 audit=0 pcie_aspm=performance

LABEL full
    MENU LABEL kutu OS (Full Optimizations)
    LINUX /arch/boot/x86_64/vmlinuz-linux
    INITRD /arch/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=kutu archisolabel=KUTU_OS quiet splash loglevel=3 mitigations=off nohz_full=1-31 rcu_nocbs=1-31 isolcpus=managed_irq,domain,1-31 irqaffinity=0 threadirqs preempt=full transparent_hugepage=madvise hugepagesz=2M default_hugepagesz=2M hugepages=2048 numa=fake=4 numa_balancing=enable nvme_core.default_ps_max_latency_us=0 nowatchdog nmi_watchdog=0 audit=0 pcie_aspm=performance pid_max=4194304

LABEL safe
    MENU LABEL kutu OS (Safe Mode)
    LINUX /arch/boot/x86_64/vmlinuz-linux
    INITRD /arch/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=kutu archisolabel=KUTU_OS nomodeset

LABEL nogpu
    MENU LABEL kutu OS (No GPU Drivers)
    LINUX /arch/boot/x86_64/vmlinuz-linux
    INITRD /arch/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=kutu archisolabel=KUTU_OS nomodeset module_blacklist=nvidia,amdgpu,i915

LABEL local
    MENU LABEL Boot from local disk
    LOCALBOOT 0

LABEL reboot
    MENU LABEL Reboot
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL Power Off
    COM32 poweroff.c32
