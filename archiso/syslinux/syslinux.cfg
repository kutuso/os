# kutu OS SYSLINUX Configuration
# Boot menu for BIOS systems

DEFAULT kutu
TIMEOUT 50
PROMPT 1

MENU TITLE kutu OS Boot Menu
MENU BACKGROUND splash.png

LABEL kutu
    MENU LABEL kutu OS (Live)
    LINUX /arch/boot/x86_64/vmlinuz-linux
    INITRD /arch/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=kutu archisolabel=KUTU_OS mitigations=off transparent_hugepage=always nvme_core.default_ps_max_latency_us=0 quiet splash

LABEL safe
    MENU LABEL kutu OS (Safe Mode)
    LINUX /arch/boot/x86_64/vmlinuz-linux
    INITRD /arch/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=kutu archisolabel=KUTU_OS nomodeset

LABEL nogpu
    MENU LABEL kutu OS (No GPU Drivers)
    LINUX /arch/boot/x86_64/vmlinuz-linux
    INITRD /arch/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=kutu archisolabel=KUTU_OS nomodeset module_blacklist=nvidia,amdgpu,i915

LABEL local
    MENU LABEL Boot from local disk
    LOCALBOOT 0

LABEL reboot
    MENU LABEL Reboot
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL Power Off
    COM32 poweroff.c32
