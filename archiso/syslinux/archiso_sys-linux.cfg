LABEL kutu
TEXT HELP
Boot the kutu OS live environment (default).
Memory-saving stack active: zswap, MGLRU, DAMON, PSI.
ENDTEXT
MENU LABEL kutu OS
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% zswap.enabled=1 zswap.compressor=zstd zswap.max_pool_percent=35 zswap.shrinker_enabled=1 psi=1 transparent_hugepage=madvise console=tty0 console=ttyS0,115200

LABEL safe
TEXT HELP
Boot kutu OS with basic graphics (nomodeset) for problematic GPUs.
ENDTEXT
MENU LABEL kutu OS (^Safe graphics)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% zswap.enabled=1 zswap.compressor=zstd zswap.max_pool_percent=35 zswap.shrinker_enabled=1 psi=1 transparent_hugepage=madvise nomodeset console=tty0 console=ttyS0,115200

LABEL memtest
MENU LABEL ^Memory test (Memtest86+)
LINUX /boot/memtest86+/memtest
