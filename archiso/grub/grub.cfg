# kutu OS GRUB Configuration
# Optimized for AI/ML inference workloads

set timeout=5
set default=0

# Graphics mode
if loadfont unicode ; then
  set gfxmode=auto
  load_video
  insmod all_video
  insmod gfxterm
  terminal_output gfxterm
fi

# Theme
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry 'kutu OS' --class arch --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux \
        archisobasedir=kutu \
        archisolabel=KUTU_OS \
        quiet splash loglevel=3 \
        mitigations=off \
        transparent_hugepage=madvise \
        nvme_core.default_ps_max_latency_us=0 \
        nowatchdog nmi_watchdog=0 \
        audit=0 \
        pcie_aspm=performance
    initrd /arch/boot/x86_64/initramfs-linux.img
}

menuentry 'kutu OS (Full Optimizations)' --class arch --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux \
        archisobasedir=kutu \
        archisolabel=KUTU_OS \
        quiet splash loglevel=3 \
        mitigations=off \
        nohz_full=1-31 rcu_nocbs=1-31 \
        isolcpus=managed_irq,domain,1-31 irqaffinity=0 \
        threadirqs preempt=full \
        transparent_hugepage=madvise \
        hugepagesz=2M default_hugepagesz=2M hugepages=2048 \
        numa=fake=4 numa_balancing=enable \
        nvme_core.default_ps_max_latency_us=0 \
        nowatchdog nmi_watchdog=0 \
        audit=0 pcie_aspm=performance \
        pid_max=4194304
    initrd /arch/boot/x86_64/initramfs-linux.img
}

menuentry 'kutu OS (Safe Mode)' --class arch --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux \
        archisobasedir=kutu \
        archisolabel=KUTU_OS \
        nomodeset
    initrd /arch/boot/x86_64/initramfs-linux.img
}

menuentry 'kutu OS (No GPU Drivers)' --class arch --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux \
        archisobasedir=kutu \
        archisolabel=KUTU_OS \
        nomodeset \
        module_blacklist=nvidia,amdgpu,i915
    initrd /arch/boot/x86_64/initramfs-linux.img
}

menuentry 'Boot from local disk' --class harddisk {
    exit
}

menuentry 'Reboot' --class restart {
    reboot
}

menuentry 'Firmware Setup (UEFI)' --class settings {
    fwsetup
}
