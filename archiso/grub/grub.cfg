# kutu OS GRUB Configuration
# Boot menu for live ISO

set timeout=5
set default=0

# Graphics mode
if loadfont unicode ; then
  set gfxmode=auto
  load_video
  insmod all_video
  insmod gfxterm
  terminal_output gfxterm
fi

# Theme
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry 'kutu OS (Live)' --class arch --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux \
        archisobasedir=kutu \
        archisolabel=KUTU_OS \
        mitigations=off \
        transparent_hugepage=always \
        nvme_core.default_ps_max_latency_us=0 \
        quiet splash
    initrd /arch/boot/x86_64/initramfs-linux.img
}

menuentry 'kutu OS (Live - Safe Mode)' --class arch --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux \
        archisobasedir=kutu \
        archisolabel=KUTU_OS \
        nomodeset
    initrd /arch/boot/x86_64/initramfs-linux.img
}

menuentry 'kutu OS (Live - No GPU Drivers)' --class arch --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux \
        archisobasedir=kutu \
        archisolabel=KUTU_OS \
        nomodeset \
        module_blacklist=nvidia,amdgpu,i915
    initrd /arch/boot/x86_64/initramfs-linux.img
}

menuentry 'Boot from local disk' --class harddisk {
    exit
}

menuentry 'Reboot' --class restart {
    reboot
}

menuentry 'Firmware Setup (UEFI)' --class settings {
    fwsetup
}
