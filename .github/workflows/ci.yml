name: ci
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: install git
        run: pacman -Sy --noconfirm git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: lint + unit tests + package builds
        env:
          KUTU_IN_DOCKER: "1"
          KUTU_FORCE_BUILD: "1"
        run: bash scripts/test.sh
