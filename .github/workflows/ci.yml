name: ci
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: install git
        run: pacman -Sy --noconfirm git
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: lint + unit tests + package builds
        env:
          KUTU_IN_DOCKER: "1"
          KUTU_FORCE_BUILD: "1"
        run: bash scripts/test.sh
