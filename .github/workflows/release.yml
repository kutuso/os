name: release
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: derive version + epoch from the tag commit
        run: |
          echo "KUTU_ISO_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: full test suite (lint, unit tests, package builds)
        env:
          KUTU_FORCE_BUILD: "1"
        run: ./scripts/test.sh
      - name: build ISO (packages + mkarchiso in privileged container)
        run: ./scripts/build.sh
      - name: import release key (when provisioned)
        id: gpgkey
        env:
          KUTU_GPG_KEY: ${{ secrets.KUTU_GPG_KEY }}
        run: |
          if [ -n "$KUTU_GPG_KEY" ]; then
            printf '%s' "$KUTU_GPG_KEY" | gpg --import
            echo "has_key=1" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=0" >> "$GITHUB_OUTPUT"
          fi
      - name: sign packages + repo db
        if: steps.gpgkey.outputs.has_key == '1'
        run: |
          for f in work/repo/*.pkg.tar.zst work/repo/kutu.db.tar.zst; do
            gpg --batch --yes --detach-sign --local-user release@kutu.so "$f"
          done
      - name: smoke test the ISO in QEMU
        run: ./scripts/smoke-test.sh
      - name: collect artifacts
        run: |
          mkdir -p release/repo/x86_64
          cp out/*.iso out/*.sha256 release/
          cp work/repo/*.pkg.tar.zst work/repo/kutu.db.tar.zst release/repo/x86_64/
          cp work/repo/*.sig release/repo/x86_64/ 2>/dev/null || true
          (cd release && sha256sum kutu-os-*.iso > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kutu-release
          path: release/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # the publish job pushes to master; the build job stays credential-free
          persist-credentials: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kutu-release
          path: release
      - name: publish pacman repo into docs/ (site is branch-deployed from docs/)
        run: |
          git config user.name "kutu release bot"
          git config user.email "release@kutu.so"
          cp README.md docs/README.md
          sed -i 's|(docs/|(./|g; s|\[docs/|[|g' docs/README.md
          mkdir -p docs/repo/x86_64
          rm -f docs/repo/x86_64/*.old docs/repo/x86_64/kutu.db docs/repo/x86_64/kutu.db.tar.zst
          cp release/repo/x86_64/. docs/repo/x86_64/
          cp docs/repo/x86_64/kutu.db.tar.zst docs/repo/x86_64/kutu.db 2>/dev/null || true
          cd docs/repo/x86_64
          shopt -s nullglob
          for name in $(ls *.pkg.tar.zst | sed -E 's/-[^-]+-[^-]+-[^-]+\.pkg\.tar\.zst$//' | sort -u); do
            esc=$(printf '%s' "$name" | sed 's/[.[\*^$]/\\&/g')
            mapfile -t versions < <(ls *.pkg.tar.zst | grep -E "^${esc}(-[^-]+){3}\.pkg\.tar\.zst$" | sort -V)
            keep=$(( ${#versions[@]} > 3 ? ${#versions[@]} - 3 : 0 ))
            for ((i=0; i<keep; i++)); do
              rm -f "${versions[$i]}" "${versions[$i]}.sig"
              echo "retention: removed ${versions[$i]}"
            done
          done
          cd -
          git add -f docs/repo docs/README.md
          git diff --cached --quiet && echo "repo unchanged" || git commit -m "repo: publish packages for ${GITHUB_REF_NAME}"
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then pushed=1; break; fi
            git fetch origin master
            git rebase origin/master || { git rebase --abort; echo "ERROR: cannot rebase repo publish onto master"; exit 1; }
          done
          [ "$pushed" = 1 ] || { echo "ERROR: failed to push repo publish to master"; exit 1; }
      - name: trigger pages build (GITHUB_TOKEN pushes don't trigger workflows)
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/kutuso/os/pages/builds
      - name: verify the published repo before announcing the release
        run: |
          base="https://kutuso.github.io/os/repo/x86_64"
          ok=0
          for i in $(seq 1 60); do
            if curl -fsSL -o /dev/null "$base/kutu.db"; then ok=1; break; fi
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "ERROR: repo db never appeared at $base/kutu.db"; exit 1; }
          for f in release/repo/x86_64/*.pkg.tar.zst; do
            curl -fsSL -o /dev/null "$base/$(basename "$f")" \
              || { echo "ERROR: package not published: $(basename "$f")"; exit 1; }
          done
          echo "published repo verified"
      - name: create github release with ISO
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          files: |
            release/kutu-os-*.iso
            release/SHA256SUMS
          generate_release_notes: true
