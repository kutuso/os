name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build ISO (packages + mkarchiso in privileged container)
        run: ./scripts/build.sh
      - name: smoke test the ISO in QEMU
        run: ./scripts/smoke-test.sh
      - name: collect artifacts
        run: |
          mkdir -p release/repo/x86_64
          cp out/*.iso out/*.sha256 release/
          cp work/repo/*.pkg.tar.zst work/repo/kutu.db.tar.zst release/repo/x86_64/ 2>/dev/null || cp work/repo/* release/repo/x86_64/
          (cd release && sha256sum kutu-os-*.iso > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: kutu-release
          path: release/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kutu-release
          path: release
      - name: publish pacman repo into docs/ (site is branch-deployed from docs/)
        run: |
          git config user.name "kutu release bot"
          git config user.email "release@kutu.so"
          cp README.md docs/README.md
          mkdir -p docs/repo/x86_64
          rm -f docs/repo/x86_64/*
          cp release/repo/x86_64/. docs/repo/x86_64/
          cp docs/repo/x86_64/kutu.db.tar.zst docs/repo/x86_64/kutu.db 2>/dev/null || true
          git add docs/repo docs/README.md
          git diff --cached --quiet && echo "repo unchanged" || git commit -m "repo: publish packages for ${GITHUB_REF_NAME}"
          git push origin HEAD:master || echo "warn: repo push failed (master moved?) — repo not published"
      - name: trigger pages build (GITHUB_TOKEN pushes don't trigger workflows)
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/kutuso/os/pages/builds \
            || echo "warn: pages build trigger failed; site deploys on next master push"
      - name: create github release with ISO
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/kutu-os-*.iso
            release/SHA256SUMS
          generate_release_notes: true
