dontChroot: true
script:
  - "sed -i '/^\\[kutu\\]/,/^$/d' ${ROOT}/etc/pacman.conf"
  - "printf '\\n[kutu]\\nSigLevel = Never\\nServer = https://kutuso.github.io/os/repo/x86_64\\n' >> ${ROOT}/etc/pacman.conf"
  - "rm -f ${ROOT}/etc/lightdm/lightdm.conf.d/20-kutu-live.conf"
  - "rm -f ${ROOT}/etc/systemd/system/getty@tty1.service.d/autologin.conf"
  - "rm -f ${ROOT}/etc/systemd/system/serial-getty@ttyS0.service.d/autologin.conf"
  - "rm -f ${ROOT}/etc/sudoers.d/g_wheel"
  - "rm -f ${ROOT}/usr/share/applications/calamares.desktop"
  - "rm -f ${ROOT}/etc/ssh/ssh_host_*_key*"
  - "systemctl --root=${ROOT} disable sshd.service"
  - "rm -f ${ROOT}/var/lib/kutu/firstboot-done ${ROOT}/etc/systemd/system/user.slice.d/50-kutu.conf ${ROOT}/etc/kutu/apps.d/firefox.conf"
  - "chroot ${ROOT} userdel -r kutu 2>/dev/null || ! chroot ${ROOT} id kutu >/dev/null 2>&1"
  - "systemctl --root=${ROOT} enable kutu-firstboot.service"
  - "test ! -e ${ROOT}/etc/systemd/system/getty@tty1.service.d/autologin.conf"
  - "test ! -e ${ROOT}/etc/sudoers.d/g_wheel"
  - "test ! -e ${ROOT}/var/lib/kutu/firstboot-done"
  - "test ! -e ${ROOT}/etc/ssh/ssh_host_ed25519_key"
  - "test -f ${ROOT}/boot/initramfs-linux.img"
  - "test \"$(grep -c '^\\[kutu\\]' ${ROOT}/etc/pacman.conf)\" = \"1\""
  - "grep -q 'kutuso.github.io/os/repo' ${ROOT}/etc/pacman.conf"
