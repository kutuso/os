<?xml version="1.0" encoding="UTF-8"?>
<!-- kutu OS logo: dark tile, pastel diagonal band, white geometric K -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="stripes" width="490" height="490" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0"   y="0" width="70"  height="490" fill="#FFB3BA"/>
      <rect x="70"  y="0" width="70"  height="490" fill="#FFDFBA"/>
      <rect x="140" y="0" width="70"  height="490" fill="#FFFFBA"/>
      <rect x="210" y="0" width="70"  height="490" fill="#BAFFC9"/>
      <rect x="280" y="0" width="70"  height="490" fill="#BAE1FF"/>
      <rect x="350" y="0" width="70"  height="490" fill="#D4BAFF"/>
      <rect x="420" y="0" width="70"  height="490" fill="#FFB3E6"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="46%" r="75%">
      <stop offset="0%" stop-color="#11111b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#11111b" stop-opacity="0.12"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#stripes)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#vignette)"/>

  <g fill="#ffffff" filter="url(#soft)">
    <path d="M166 120 h54 v272 h-54 z"/>
    <path d="M220 272 L346 120 L408 120 L282 272 z"/>
    <path d="M220 262 L346 392 L408 392 L282 262 z"/>
  </g>
</svg>