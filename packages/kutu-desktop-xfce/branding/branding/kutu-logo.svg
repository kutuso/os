<?xml version="1.0" encoding="UTF-8"?>
<!-- kutu OS Logo - Pastel Rainbow Stripes (No Gradient) -->
<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Pattern for diagonal stripes -->
    <pattern id="diagonal-stripes" x="0" y="0" width="490" height="490" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="70" height="490" fill="#FFB3BA"/>    <!-- Pastel Pink -->
      <rect x="70" y="0" width="70" height="490" fill="#FFDFBA"/>  <!-- Pastel Peach -->
      <rect x="140" y="0" width="70" height="490" fill="#FFFFBA"/>  <!-- Pastel Yellow -->
      <rect x="210" y="0" width="70" height="490" fill="#BAFFC9"/>  <!-- Pastel Green -->
      <rect x="280" y="0" width="70" height="490" fill="#BAE1FF"/>  <!-- Pastel Blue -->
      <rect x="350" y="0" width="70" height="490" fill="#D4BAFF"/>  <!-- Pastel Purple -->
      <rect x="420" y="0" width="70" height="490" fill="#FFB3E6"/>  <!-- Pastel Magenta -->
    </pattern>

    <!-- Subtle shadow -->
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background with rainbow stripes -->
  <rect x="16" y="16" width="480" height="480" rx="80" ry="80"
        fill="url(#diagonal-stripes)" filter="url(#shadow)"/>

  <!-- Large "K" letter in white -->
  <text x="256" y="340"
        font-family="Arial, sans-serif"
        font-size="280"
        font-weight="bold"
        fill="white"
        text-anchor="middle"
        style="text-shadow: 2px 2px 8px rgba(0,0,0,0.2);">K</text>
</svg>
