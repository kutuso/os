<?xml version="1.0" encoding="UTF-8"?>
<!-- kutu OS wallpaper: woven light, two crossing thread fields -->
<svg width="3840" height="2160" viewBox="0 0 3840 2160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11111b"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <radialGradient id="lift" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#BAE1FF" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#11111b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#11111b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="48%" r="75%">
      <stop offset="0%" stop-color="#11111b" stop-opacity="0"/>
      <stop offset="76%" stop-color="#11111b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#11111b" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#sky)"/>

  <g transform="rotate(45 1920 1080)">
    <rect x="-1200" y="1300" width="7440" height="90" fill="#FFB3BA" opacity="0.16"/>
    <rect x="-1200" y="1490" width="7440" height="90" fill="#FFDFBA" opacity="0.14"/>
    <rect x="-1200" y="1680" width="7440" height="90" fill="#FFFFBA" opacity="0.12"/>
    <rect x="-1200" y="870" width="7440" height="90" fill="#BAFFC9" opacity="0.15"/>
    <rect x="-1200" y="680" width="7440" height="90" fill="#BAE1FF" opacity="0.17"/>
    <rect x="-1200" y="490" width="7440" height="90" fill="#D4BAFF" opacity="0.15"/>
    <rect x="-1200" y="300" width="7440" height="90" fill="#FFB3E6" opacity="0.13"/>
  </g>
  <g transform="rotate(-45 1920 1080)">
    <rect x="-1200" y="1340" width="7440" height="70" fill="#D4BAFF" opacity="0.13"/>
    <rect x="-1200" y="1540" width="7440" height="70" fill="#BAE1FF" opacity="0.12"/>
    <rect x="-1200" y="1740" width="7440" height="70" fill="#BAFFC9" opacity="0.11"/>
    <rect x="-1200" y="940" width="7440" height="70" fill="#FFFFBA" opacity="0.1"/>
    <rect x="-1200" y="740" width="7440" height="70" fill="#FFDFBA" opacity="0.11"/>
    <rect x="-1200" y="540" width="7440" height="70" fill="#FFB3BA" opacity="0.12"/>
  </g>

  <rect width="3840" height="2160" fill="url(#lift)"/>
  <rect width="3840" height="2160" fill="url(#vig)"/>
  <rect width="3840" height="2160" filter="url(#grain)"/>
</svg>