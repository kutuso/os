<?xml version="1.0" encoding="UTF-8"?>
<!-- kutu OS wallpaper: halftone drift, magenta into blue -->
<svg width="3840" height="2160" viewBox="0 0 3840 2160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11111b"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB3E6"/>
      <stop offset="38%" stop-color="#D4BAFF"/>
      <stop offset="70%" stop-color="#BAE1FF"/>
      <stop offset="100%" stop-color="#BAFFC9"/>
    </linearGradient>
    <linearGradient id="fade2" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFB3BA"/>
      <stop offset="55%" stop-color="#FFDFBA"/>
      <stop offset="100%" stop-color="#FFFFBA"/>
    </linearGradient>
    <pattern id="dots" width="140" height="140" patternUnits="userSpaceOnUse">
      <circle cx="70" cy="70" r="44" fill="#ffffff"/>
    </pattern>
    <pattern id="dots2" width="150" height="150" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <circle cx="75" cy="75" r="24" fill="#ffffff"/>
    </pattern>
    <mask id="m1">
      <rect width="3840" height="2160" fill="url(#dots)"/>
    </mask>
    <mask id="m2">
      <rect width="3840" height="2160" fill="url(#dots2)"/>
    </mask>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#sky)"/>
  <g transform="rotate(-4 1920 1080)">
    <rect x="-300" y="-300" width="4440" height="2760" fill="url(#fade)" mask="url(#m1)" opacity="0.34"/>
    <rect x="-300" y="-300" width="4440" height="2760" fill="url(#fade2)" mask="url(#m2)" opacity="0.18"/>
  </g>
  <rect width="3840" height="2160" filter="url(#grain)"/>
</svg>