<?xml version="1.0" encoding="UTF-8"?>
<!-- kutu OS wallpaper: pigment clouds warped by slow noise -->
<svg width="3840" height="2160" viewBox="0 0 3840 2160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11111b"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <radialGradient id="c1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB3E6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFB3E6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4BAFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D4BAFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BAE1FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#BAE1FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BAFFC9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#BAFFC9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDFBA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFDFBA" stop-opacity="0"/>
    </radialGradient>
    <filter id="warp" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.005" numOctaves="3" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="460" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#sky)"/>
  <g filter="url(#warp)">
    <ellipse cx="880" cy="820" rx="820" ry="640" fill="url(#c2)"/>
    <ellipse cx="2980" cy="620" rx="900" ry="560" fill="url(#c3)"/>
    <ellipse cx="1920" cy="1600" rx="1000" ry="520" fill="url(#c1)"/>
    <ellipse cx="3460" cy="1640" rx="620" ry="520" fill="url(#c4)"/>
    <ellipse cx="540" cy="1760" rx="560" ry="420" fill="url(#c5)"/>
  </g>
  <rect width="3840" height="2160" filter="url(#grain)"/>
</svg>