<?xml version="1.0" encoding="UTF-8"?>
<!-- kutu OS wallpaper: broken orbits around a hidden star -->
<svg width="3840" height="2160" viewBox="0 0 3840 2160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11111b"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BAE1FF" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#D4BAFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#11111b" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#sky)"/>
  <circle cx="2520" cy="1080" r="1200" fill="url(#core)"/>

  <g fill="none" transform="rotate(-12 2520 1080)">
    <g filter="url(#soft)" opacity="0.7">
      <circle cx="2520" cy="1080" r="340" stroke="#FFB3BA" stroke-width="34" stroke-dasharray="420 210"/>
      <circle cx="2520" cy="1080" r="560" stroke="#FFDFBA" stroke-width="26" stroke-dasharray="300 260"/>
      <circle cx="2520" cy="1080" r="800" stroke="#FFFFBA" stroke-width="18" stroke-dasharray="700 420"/>
      <circle cx="2520" cy="1080" r="1060" stroke="#BAFFC9" stroke-width="22" stroke-dasharray="520 480"/>
      <circle cx="2520" cy="1080" r="1330" stroke="#BAE1FF" stroke-width="16" stroke-dasharray="1100 700"/>
      <circle cx="2520" cy="1080" r="1620" stroke="#D4BAFF" stroke-width="12" stroke-dasharray="820 900"/>
      <circle cx="2520" cy="1080" r="1920" stroke="#FFB3E6" stroke-width="10" stroke-dasharray="1500 1200"/>
    </g>
    <circle cx="2520" cy="1080" r="340" stroke="#FFB3BA" stroke-width="14" stroke-dasharray="420 210" opacity="0.9"/>
    <circle cx="2520" cy="1080" r="560" stroke="#FFDFBA" stroke-width="10" stroke-dasharray="300 260" opacity="0.85"/>
    <circle cx="2520" cy="1080" r="800" stroke="#FFFFBA" stroke-width="8" stroke-dasharray="700 420" opacity="0.8"/>
    <circle cx="2520" cy="1080" r="1060" stroke="#BAFFC9" stroke-width="9" stroke-dasharray="520 480" opacity="0.85"/>
    <circle cx="2520" cy="1080" r="1330" stroke="#BAE1FF" stroke-width="7" stroke-dasharray="1100 700" opacity="0.85"/>
    <circle cx="2520" cy="1080" r="1620" stroke="#D4BAFF" stroke-width="6" stroke-dasharray="820 900" opacity="0.8"/>
    <circle cx="2520" cy="1080" r="1920" stroke="#FFB3E6" stroke-width="5" stroke-dasharray="1500 1200" opacity="0.7"/>
    <g>
      <circle cx="2860" cy="1080" r="18" fill="#FFB3BA"/>
      <circle cx="2520" cy="1640" r="14" fill="#BAFFC9"/>
      <circle cx="3580" cy="1080" r="12" fill="#BAE1FF"/>
      <circle cx="2380" cy="520" r="10" fill="#D4BAFF"/>
      <circle cx="4440" cy="1080" r="9" fill="#FFB3E6"/>
    </g>
  </g>

  <rect width="3840" height="2160" filter="url(#grain)"/>
</svg>