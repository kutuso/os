  <circle cx="3580" cy="1620" r="44" fill="url(#d5)"/>
  <circle cx="2280" cy="1240" r="46" fill="url(#d5)"/>
  <circle cx="2980" cy="1980" r="66" fill="url(#d3)"/>
  <circle cx="2620" cy="1980" r="40" fill="url(#d1)"/>
