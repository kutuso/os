<?xml version="1.0" encoding="UTF-8"?>
<!-- kutu OS wallpaper: soft-focus bokeh of the pastel spectrum -->
<svg width="3840" height="2160" viewBox="0 0 3840 2160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11111b"/>
      <stop offset="60%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
    <radialGradient id="d1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB3BA" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#FFB3BA" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFB3BA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="d2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDFBA" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#FFDFBA" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFDFBA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="d3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFBA" stop-opacity="0.65"/>
      <stop offset="70%" stop-color="#FFFFBA" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFBA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="d4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BAFFC9" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#BAFFC9" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#BAFFC9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="d5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BAE1FF" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#BAE1FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#BAE1FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="d6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4BAFF" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#D4BAFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#D4BAFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="d7" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB3E6" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#FFB3E6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFB3E6" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#sky)"/>

  <circle cx="2960" cy="520" r="360" fill="url(#d5)"/>
