<?xml version="1.0" encoding="UTF-8"?>
<!-- kutu OS wallpaper: moody gradient with pastel glows -->
<svg width="3840" height="2160" viewBox="0 0 3840 2160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="60%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <radialGradient id="glow1" cx="12%" cy="88%" r="55%">
      <stop offset="0%" stop-color="#D4BAFF" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#BAE1FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#11111b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="88%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#FFB3E6" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#FFB3BA" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#11111b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="3840" height="2160" fill="url(#sky)"/>
  <rect width="3840" height="2160" fill="url(#glow1)"/>
  <rect width="3840" height="2160" fill="url(#glow2)"/>
</svg>