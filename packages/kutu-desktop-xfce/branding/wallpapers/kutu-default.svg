<?xml version="1.0" encoding="UTF-8"?>
<!-- kutu OS Default Wallpaper - Pastel Rainbow Waves -->
<svg width="3840" height="2160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Pastel rainbow gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB3BA;stop-opacity:1" />
      <stop offset="16.67%" style="stop-color:#FFDFBA;stop-opacity:1" />
      <stop offset="33.33%" style="stop-color:#FFFFBA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#BAFFC9;stop-opacity:1" />
      <stop offset="66.67%" style="stop-color:#BAE1FF;stop-opacity:1" />
      <stop offset="83.33%" style="stop-color:#D4BAFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB3E6;stop-opacity:1" />
    </linearGradient>

    <!-- Overlay gradient for depth -->
    <radialGradient id="overlay">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.2" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="3840" height="2160" fill="url(#bg-gradient)"/>

  <!-- Decorative wave patterns -->
  <g opacity="0.3">
    <path d="M 0 1000 Q 960 800, 1920 1000 T 3840 1000 L 3840 2160 L 0 2160 Z"
          fill="#ffffff"/>
    <path d="M 0 1200 Q 960 1000, 1920 1200 T 3840 1200 L 3840 2160 L 0 2160 Z"
          fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Subtle overlay for depth -->
  <rect width="3840" height="2160" fill="url(#overlay)"/>

  <!-- Center logo -->
  <g transform="translate(1664, 824)">
    <!-- Logo background -->
    <rect x="0" y="0" width="512" height="512" rx="80" ry="80"
          fill="url(#bg-gradient)" opacity="0.8"
          style="filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3));"/>

    <!-- K letter -->
    <text x="256" y="340"
          font-family="Arial, sans-serif"
          font-size="280"
          font-weight="bold"
          fill="white"
          text-anchor="middle"
          style="text-shadow: 2px 2px 8px rgba(0,0,0,0.3);">K</text>
  </g>

  <!-- Subtle text at bottom -->
  <text x="1920" y="2080"
        font-family="Arial, sans-serif"
        font-size="36"
        fill="white"
        text-anchor="middle"
        opacity="0.6">kutu OS</text>
</svg>
