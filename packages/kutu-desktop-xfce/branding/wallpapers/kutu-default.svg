<?xml version="1.0" encoding="UTF-8"?>
<!-- kutu OS default wallpaper: dark field, signal waves, pastel ribbon -->
<svg width="3840" height="2160" viewBox="0 0 3840 2160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11111b"/>
      <stop offset="55%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
    <pattern id="ribbon" width="490" height="490" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0"   y="0" width="70"  height="490" fill="#FFB3BA"/>
      <rect x="70"  y="0" width="70"  height="490" fill="#FFDFBA"/>
      <rect x="140" y="0" width="70"  height="490" fill="#FFFFBA"/>
      <rect x="210" y="0" width="70"  height="490" fill="#BAFFC9"/>
      <rect x="280" y="0" width="70"  height="490" fill="#BAE1FF"/>
      <rect x="350" y="0" width="70"  height="490" fill="#D4BAFF"/>
      <rect x="420" y="0" width="70"  height="490" fill="#FFB3E6"/>
    </pattern>
    <clipPath id="band">
      <path d="M0 2160 L2160 0 h560 L560 2160 z"/>
    </clipPath>
    <clipPath id="lower">
      <path d="M0 1180 Q 960 980, 1920 1180 T 3840 1180 L3840 2160 L0 2160 z"/>
    </clipPath>
  </defs>

  <rect width="3840" height="2160" fill="url(#sky)"/>

  <g clip-path="url(#band)" opacity="0.8">
    <rect width="3840" height="2160" fill="url(#ribbon)"/>
  </g>

  <g opacity="0.5">
    <path d="M0 1180 Q 960 980, 1920 1180 T 3840 1180 L3840 1220 Q 2880 1020, 1920 1220 T 0 1220 z" fill="#BAE1FF" opacity="0.08"/>
    <path d="M0 1300 Q 960 1100, 1920 1300 T 3840 1300 L3840 1330 Q 2880 1130, 1920 1330 T 0 1330 z" fill="#BAFFC9" opacity="0.06"/>
    <path d="M0 1420 Q 960 1220, 1920 1420 T 3840 1420 L3840 1440 Q 2880 1240, 1920 1440 T 0 1440 z" fill="#D4BAFF" opacity="0.05"/>
  </g>

  <rect y="2140" width="3840" height="20" fill="url(#ribbon)" opacity="0.9"/>
</svg>