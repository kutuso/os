<?xml version="1.0" encoding="UTF-8"?>
<!-- kutu OS wallpaper: pastel ribbons flowing across the deep -->
<svg width="3840" height="2160" viewBox="0 0 3840 2160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="r1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB3BA"/>
      <stop offset="100%" stop-color="#FFDFBA"/>
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFBA"/>
      <stop offset="100%" stop-color="#BAFFC9"/>
    </linearGradient>
    <linearGradient id="r3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BAFFC9"/>
      <stop offset="100%" stop-color="#BAE1FF"/>
    </linearGradient>
    <linearGradient id="r4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BAE1FF"/>
      <stop offset="100%" stop-color="#D4BAFF"/>
    </linearGradient>
    <linearGradient id="r5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4BAFF"/>
      <stop offset="100%" stop-color="#FFB3E6"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="48%" r="74%">
      <stop offset="0%" stop-color="#11111b" stop-opacity="0"/>
      <stop offset="80%" stop-color="#11111b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#11111b" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
    <filter id="blur60" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#sky)"/>

  <g filter="url(#blur60)" opacity="0.5">
    <path d="M-200 700 C 700 300, 1600 1400, 2500 900 S 3600 400, 4100 760 L 4100 900 C 3600 540, 2550 1040, 2500 1040 C 1600 1540, 700 440, -200 840 z" fill="url(#r4)"/>
    <path d="M-200 1500 C 800 1100, 1900 1900, 2900 1400 S 3800 1200, 4100 1500 L 4100 1650 C 3800 1350, 2950 1550, 2900 1550 C 1900 2050, 800 1250, -200 1650 z" fill="url(#r2)"/>
  </g>

  <path d="M-200 700 C 700 300, 1600 1400, 2500 900 S 3600 400, 4100 760 L 4100 900 C 3600 540, 2550 1040, 2500 1040 C 1600 1540, 700 440, -200 840 z" fill="url(#r1)" opacity="0.85"/>
  <path d="M-200 520 C 900 160, 1700 1200, 2700 640 S 3700 260, 4100 560 L 4100 700 C 3700 400, 2750 780, 2700 780 C 1700 1340, 900 300, -200 660 z" fill="url(#r2)" opacity="0.75"/>
  <path d="M-200 980 C 800 560, 1800 1560, 2800 1000 S 3700 640, 4100 940 L 4100 1080 C 3700 780, 2850 1140, 2800 1140 C 1800 1700, 800 700, -200 1120 z" fill="url(#r3)" opacity="0.8"/>
  <path d="M-200 1500 C 800 1100, 1900 1900, 2900 1400 S 3800 1200, 4100 1500 L 4100 1650 C 3800 1350, 2950 1550, 2900 1550 C 1900 2050, 800 1250, -200 1650 z" fill="url(#r4)" opacity="0.85"/>
  <path d="M-200 1760 C 1000 1500, 2000 2100, 3000 1700 S 3900 1560, 4100 1780 L 4100 1880 C 3900 1660, 3050 1800, 3000 1800 C 2000 2200, 1000 1600, -200 1860 z" fill="url(#r5)" opacity="0.7"/>

  <rect width="3840" height="2160" fill="url(#vig)"/>
  <rect width="3840" height="2160" filter="url(#grain)"/>
</svg>